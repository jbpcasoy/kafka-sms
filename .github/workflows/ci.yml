name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student-service:
    name: student-service (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/student-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  e2e:
    name: e2e (docker compose + Kafka)
    runs-on: ubuntu-latest
    needs: student-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Start stack
        run: docker compose up --build --detach --wait
      - name: Run end-to-end tests
        run: uv run --with pytest --with confluent-kafka pytest -q tests/e2e
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
